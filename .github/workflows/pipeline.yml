name: CI_CD EXE_PreOrder Service with Docker Hub and Google Cloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check if .NET backend source changed
        id: changes
        run: |
          git fetch origin main
          if git diff --quiet HEAD^ HEAD -- src/; then
            echo "No changes in backend code."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in backend code."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug build flag
        run: echo "Skip build? ${{ steps.changes.outputs.skip_build }}"

      - name: Set up .NET
        if: steps.changes.outputs.skip_build == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build
        if: steps.changes.outputs.skip_build == 'false'
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

  docker-build-and-push:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check if .NET backend source changed
        id: changes
        run: |
          git fetch origin main
          if git diff --quiet HEAD^ HEAD -- src/; then
            echo "No changes in backend code."
            echo "skip_docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in backend code."
            echo "skip_docker=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.changes.outputs.skip_docker == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Log in to Docker Hub
        if: steps.changes.outputs.skip_docker == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        if: steps.changes.outputs.skip_docker == 'false'
        run: |
          docker build -t nguyentanthanh1403/exe_preorder:latest .
          docker tag nguyentanthanh1403/exe_preorder:latest nguyentanthanh1403/exe_preorder:${{ github.sha }}
          docker push nguyentanthanh1403/exe_preorder:latest
          docker push nguyentanthanh1403/exe_preorder:${{ github.sha }}

  deploy:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: CD to GCP via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: thanhnt.tech
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/thanhnt.tech/EXE_PreOrder
            docker compose pull
            docker compose down
            docker compose up -d --remove-orphans
